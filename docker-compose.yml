services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  mcp-ollama:
    build: ./mcp-ollama
    container_name: mcp-ollama
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:3b
      - WORKSPACE=/workspace
      - MAX_FILE_CHARS=8000
      - MAX_TOTAL_CONTEXT_CHARS=32000
      - MAX_FILES_PER_REQUEST=20
    volumes:
      - ./:/workspace
    depends_on:
      - ollama

volumes:
  ollama-data: