[workspace]
root = /workspace
backup_dir = .backups
trash_dir = .trash
log_dir = .agent_logs
ignore_folders = .git, node_modules, __pycache__, .venv, venv, dist, build, .backups, .agent_logs
supported_extensions = .py, .js, .ts, .tsx, .jsx, .json, .yaml, .yml, .md, .txt, .html, .css, .env.example, .dockerfile, Dockerfile
default_target_files = app/main.py, requirements.txt, Dockerfile
config_file_patterns = *.json, *.yaml, *.yml, Dockerfile, *.toml

[limits]
max_file_chars = 8000
max_total_context_chars = 32000
max_files_per_request = 20

[ollama]
host = http://ollama:11434
model = qwen2.5-coder:3b
